{%- comment -%}
  Structured data (schema.org JSON-LD) so search engines know who we are.
  Home page: the organisation and the website.
{%- endcomment -%}
{%- assign home = "/" | absolute_url -%}
{%- assign org_id = home | append: "#organization" -%}
{%- if page.url == "/" %}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@graph": [
    {
      "@type": "Organization",
      "@id": {{ org_id | jsonify }},
      "name": {{ site.title | jsonify }},
      "alternateName": "Wallyford CC",
      "url": {{ home | jsonify }},
      "logo": {{ "/assets/img/logo-512.png" | absolute_url | jsonify }},
      "image": {{ "/assets/img/miners-stone-gardens.jpg" | absolute_url | jsonify }},
      "email": {{ site.email | jsonify }},
      "description": {{ site.description | strip_newlines | strip | jsonify }},
      "areaServed": { "@type": "Place", "name": "Wallyford, East Lothian, Scotland" }{% if site.facebook_url and site.facebook_url != "" %},
      "sameAs": [ {{ site.facebook_url | jsonify }} ]{% endif %}
    },
    {
      "@type": "WebSite",
      "name": {{ site.title | jsonify }},
      "alternateName": "Wallyford CC",
      "url": {{ home | jsonify }},
      "inLanguage": "en-GB",
      "publisher": { "@id": {{ org_id | jsonify }} }
    }
  ]
}
</script>
{%- endif -%}
