# ------------------------------------------------------------------
# Wallyford Community Council website settings
# Most day-to-day changes happen here or in the _data folder.
# ------------------------------------------------------------------

title: Wallyford Community Council
description: >-
  Wallyford Community Council is the voluntary, independent voice of the
  people of Wallyford, East Lothian.

# GitHub Pages project address. If you move to your own web address
# (e.g. wallyfordcc.org.uk), change baseurl to "" and set url.
url: "https://dochtie.github.io"
baseurl: "/wallyford-community-council"

# Contact details used across the site
email: WallyfordCommunityCouncil@gmail.com

# TO DO: paste the Facebook group link between the quotes.
facebook_url: ""

# Meetings (used on the home page and Council page)
meeting_time: "6.30pm"
meeting_place: "Assembly Hall, Wallyford Learning Campus"
meeting_way_in: "Come in through the Leisure entrance, by the car park."
meeting_rule: "Last Wednesday of every month, except July and December"

# "You said, we did" tracker.
# In the Google Sheet: File > Share > Publish to web > Tracker tab > CSV.
# Paste the link between the quotes. While it is empty (and draft mode
# is on) the page shows a labelled preview from assets/data/tracker-preview.csv.
tracker_csv_url: "https://docs.google.com/spreadsheets/d/e/2PACX-1vRhLqQXUZWSXX9WMuhjoLAvN9B2GUNI3OXTp7LB90Bueh7ppSRrnt8P-RbpYSKymi3hFJwz1RM0faPn/pub?gid=0&single=true&output=csv"

# Draft helper. While true, "please check" and "to fill in" notes are
# visible on the pages. Set to false before the site goes public.
show_review_notes: true

# News posts live in the _posts folder (one Markdown file per post,
# named like 2026-10-28-agm.md). Their web addresses look like
# /news/2026/10/28/agm/
defaults:
  - scope:
      type: posts
    values:
      layout: post
      permalink: /news/:year/:month/:day/:title/

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
