# ------------------------------------------------------------------
# Wallyford Community Council website settings
# Most day-to-day changes happen here or in the _data folder.
# ------------------------------------------------------------------

title: Wallyford Community Council
description: >-
  Wallyford Community Council is the elected, independent voice of the
  people of Wallyford, East Lothian.

# GitHub Pages project address. If you move to your own web address
# (e.g. wallyfordcc.org.uk), change baseurl to "" and set url.
url: "https://dochtie.github.io"
baseurl: "/wallyford-community-council"

# Contact details used across the site
email: WallyfordCommunityCouncil@gmail.com

# Credit line at the bottom of every page. Change the wording here,
# or leave it empty ("") to hide it.
site_credit: "Website by Matthew Williams, Community Council Treasurer."

# Facebook group link
facebook_url: "https://www.facebook.com/groups/170616703520157/"

# Meetings (general wording used across the site; the actual dates come
# from the Upcoming dates tab of the website sheet)
meeting_time: "6.30pm"
meeting_place: "Assembly Hall, Wallyford Learning Campus"
meeting_way_in: "Come in through the Leisure entrance, by the car park."
meeting_rule: "Last Wednesday of every month, except July and December"

# Agendas and minutes: paste the link to where people can read them (for
# example a Google Drive folder shared with "Anyone with the link") between
# the quotes. A button to it then appears in the Meetings part of the
# Community Council page. While it's empty, that page asks people to email.
minutes_url: ""

# The website sheet in Google Drive: "Wallyford CC - Website updates".
# It is published with File > Share > Publish to web > Entire document,
# so every tab has its own CSV link: the same link with a different gid.
# While a link is empty (and draft mode is on) the page shows a labelled
# preview from the assets/data folder instead.

# Tracker tab: the "You said, we did" page and the home page updates.
tracker_csv_url: "https://docs.google.com/spreadsheets/d/e/2PACX-1vRhLqQXUZWSXX9WMuhjoLAvN9B2GUNI3OXTp7LB90Bueh7ppSRrnt8P-RbpYSKymi3hFJwz1RM0faPn/pub?gid=0&single=true&output=csv"

# Upcoming dates tab: every date on the site (meetings, Remembrance, the
# Torchlight Parade, Gala Day and anything else), shown in the home page
# "Coming up" box, the What's on page and as the "next meeting" and
# Torchlight Parade dates. Nothing is worked out automatically.
events_csv_url: "https://docs.google.com/spreadsheets/d/e/2PACX-1vRhLqQXUZWSXX9WMuhjoLAvN9B2GUNI3OXTp7LB90Bueh7ppSRrnt8P-RbpYSKymi3hFJwz1RM0faPn/pub?gid=1388422878&single=true&output=csv"

# Speedwatch tab: results for the counter on the Speedwatch page.
speedwatch_csv_url: "https://docs.google.com/spreadsheets/d/e/2PACX-1vRhLqQXUZWSXX9WMuhjoLAvN9B2GUNI3OXTp7LB90Bueh7ppSRrnt8P-RbpYSKymi3hFJwz1RM0faPn/pub?gid=416366346&single=true&output=csv"

# Show the Speedwatch results counter. It's switched off for now:
# change to true to put it back on the Speedwatch page.
speedwatch_show_results: false

# Google Search Console: paste the code from Google's "HTML tag"
# verification between the quotes (just the code, e.g. "abc123...").
google_site_verification: ""

# Draft helper. While true, "please check" and "to fill in" notes are
# visible on the pages, and search engines are asked not to list the
# site. Set to false before the site goes public.
show_review_notes: true

exclude:
  - README.md
  - tools
  - Gemfile
  - Gemfile.lock
  - vendor
