<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script>document.documentElement.className += " js";</script>
  <title>{% if page.title and page.url != "/" %}{{ page.title }} | {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description | strip_newlines | escape }}">
  <meta property="og:title" content="{{ page.title | default: site.title | escape }}">
  <meta property="og:description" content="{{ page.description | default: site.description | strip_newlines | escape }}">
  <meta property="og:image" content="{{ '/assets/img/miners-stone.jpg' | absolute_url }}">
  <meta property="og:type" content="website">
  <meta name="theme-color" content="#1d2023">
  <link rel="icon" href="{{ '/assets/img/favicon.svg' | relative_url }}" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Source+Sans+3:ital,wght@0,400;0,600;0,700;1,400&display=swap">
  <link rel="stylesheet" href="{{ '/assets/css/site.css' | relative_url }}">
</head>
<body id="top">
  <a class="skip-link" href="#main">Skip to content</a>
  {% include header.html %}
  <main id="main">
    {{ content }}
  </main>
  {% include footer.html %}
  <script>
    window.WCC = {
      trackerUrl: {{ site.tracker_csv_url | jsonify }},
      sampleUrl: {{ '/assets/data/tracker-preview.csv' | relative_url | jsonify }},
      draft: {{ site.show_review_notes | jsonify }},
      base: {{ '/' | relative_url | jsonify }},
      events: {{ site.data.events | jsonify }}
    };
  </script>
  <script src="{{ '/assets/js/site.js' | relative_url }}" defer></script>
</body>
</html>
