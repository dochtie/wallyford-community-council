---
layout: default
nav: news
---

<header class="page-head">
  <div class="wrap">
    <p class="eyebrow"><a href="{{ '/news/' | relative_url }}" style="color:inherit">News</a> &middot; {{ page.date | date: "%-d %B %Y" }}</p>
    <h1>{{ page.title }}</h1>
    {% if page.summary %}<p class="lede">{{ page.summary }}</p>{% endif %}
  </div>
</header>
<div class="strata" aria-hidden="true"></div>

<article class="section">
  <div class="wrap">
    <div class="prose">
      {{ content }}
      <p style="margin-top:2.5rem"><a class="btn btn-dark" href="{{ '/news/' | relative_url }}">&larr; All news</a></p>
    </div>
  </div>
</article>
