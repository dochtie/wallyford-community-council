# Local groups shown on the Local groups page.
# Copy an entry and fill in what you have. Any line can be left blank.
# about:   a line about what the group does
# contact: how to get in touch (only publish a personal phone number or
#          email with that person's OK)
# link:    a web address, such as the group's website
# facebook: the group's Facebook page or group (optional)
# facebook_label: link text for the Facebook link, e.g. "Facebook group" (optional)
# check:   a draft note asking the council to confirm something (optional)

community:
  - name: "Wallyford Children's Gala Day Committee"
    about: "Organises Wallyford Children's Gala Day every June."
    contact: ""
    link: ""
    facebook: "https://www.facebook.com/share/g/1KTXtDyMAt/"
    facebook_label: "Children's Gala Facebook group"

  - name: "Wallyford Community Centre"
    about: "Wallyford Community Centre is in the Wallyford Learning Campus, Masons Way, EH21 8BF. It is a venue for local groups and events."
    contact: "wallyfordcommunitycentre@eastlothian.gov.uk"
    link: ""
    facebook: "https://www.facebook.com/share/14tafFaeGJb/"
    facebook_label: "Community Centre on Facebook"

  - name: "Wallyford Library"
    about: "Wallyford Library is at 25 Masons Way, EH21 8BF, in the Wallyford Learning Campus. Open Thursday 9am to 1pm and 2pm to 5pm, Friday 9am to 12pm and 1pm to 5pm, and Saturday 10am to 1pm. Free Wi-Fi, Click and Collect, and Bookbug sessions for under-5s on Thursdays and Saturdays at 10.30am. Phone 0131 202 8466 (option 3)."
    contact: "wallyford.library@eastlothian.gov.uk"
    link: "https://www.eastlothian.gov.uk/libraries-leisure-and-tourism/libraries/east-lothian-libraries/wallyford-library"
    facebook: "https://www.facebook.com/share/18SJvTXJWd/"
    facebook_label: "Libraries on Facebook"

  - name: "Wallyford Community Church"
    about: "Albert Place. Hosts the village's Remembrance Sunday service."
    contact: "office@wallyfordchurch.org"
    link: "https://www.wallyfordchurch.org/"

  - name: "Tots+"
    about: "A weekly group at Wallyford Community Church, Albert Place, where parents and carers of young children can meet. Thursdays, 10am to 11.30am, in term time. A donation of £1.50 is asked."
    contact: "office@wallyfordchurch.org"
    link: "https://www.wallyfordchurch.org/what-s-happening"

  - name: "Playgroup"
    about: "A local playgroup. The Facebook page has more information for anyone who is interested."
    contact: ""
    link: ""
    facebook: "https://www.facebook.com/share/19enn2CUpU/"
    facebook_label: "Playgroup on Facebook"

  - name: "Wallyford Parents and Carers Council (WPACC)"
    about: "The parent council for Wallyford Primary School and Nursery. It represents parents and carers, supports the school, and raises money through things like bake sales and discos. Everyone is welcome at its meetings, and you don't need to be a member. Meetings are on the first Tuesday of the month, 6pm to 7.30pm, in school."
    contact: "wallyfordpacc@gmail.com"
    link: "https://sites.google.com/view/wallyfordprimaryschoolpacc/home"
    facebook: "https://www.facebook.com/share/1FN9UteuUz/"
    facebook_label: "WPACC on Facebook"

  - name: "Rosehill and The Brae Parent Network (Parent Council)"
    about: "The parent council for Rosehill High School. Any parent or carer of a young person at the school is part of its parent forum, and any member of the forum can join the council. Meetings are held in school from 6.30pm, about five times a year, with the option to join online (you can listen in but can't ask questions). This year's dates are on the parent council's page."
    contact: "rosehillhighpc@gmail.com"
    link: "https://sites.google.com/edubuzz.org/rosehill-high-school/parent-engagement/rosehill-and-the-brae-parent-network-parent-council"

  - name: "Wallyford Miners Welfare Society & Social Club"
    about: "The heart of the community in Wallyford, on Salters Road. A local charity set up to support the mining community, the club hosts live entertainment, charity fundraisers, family celebrations and private functions. It has a main hall, a lounge, the Jungle Bar for pool and darts, and a bowling section, and the hall is available to hire. The Torchlight Parade sets off from its car park every December."
    contact: "info@wallyfordminers.co.uk"
    link: "https://wallyfordminers.co.uk/"

