# One-off events for the "Coming up" box on the home page.
#
# Regular events are added automatically, so you don't need to list them:
#   - community council meetings (last Wednesday, not July or December)
#   - Remembrance Sunday and Armistice Day
#   - the Torchlight Parade (first Friday in December)
#   - Gala Day (first Saturday in June)
#   - the Battle of Pinkie commemoration (10 September)
#
# Past events disappear by themselves. To add one, copy this example,
# remove the # signs, and fill it in:
#
# - date: 2026-11-21            (year-month-day)
#   time: "10am to 12pm"
#   title: "Litter pick on the Bing"
#   place: "Meet at the Bing path entrance"
#   link: ""                    (optional web address)

