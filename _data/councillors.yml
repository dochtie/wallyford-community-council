- name: Willie Gordon
  role: Member
  photo:
  blurb: |
    I’m a proud member of the Wallyford community, with a strong passion for supporting local people, improving our village and bringing people together.

    Having previously served as Chair of the Wallyford Primary School PACC for two years, and as a class representative before that, I’ve been actively involved in a range of local initiatives. These have included community events, the walking bus, fundraising and projects supporting local families and children.

    I believe in the importance of working together, listening to residents and making a positive difference. I’m keen to bring my experience, enthusiasm and community spirit to Wallyford Community Council and continue helping to make our village a welcoming, inclusive and thriving place for everyone.
