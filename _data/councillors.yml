- name: Alli Coyle
  role: Chair
  photo: alli-coyle.jpg
  blurb: "I moved to Wallyford in 2021 and started attending Community Council meetings a while later. I got involved as I wanted to help foster community cohesion and create a safe place for all. As Chair,  I provide leadership to the committee. If you see me around, say hello and if you want to find out more about the Community Council come along to a meeting!"

