- name: Matthew Williams
  role: Treasurer
  photo: matthew-williams.jpg
  blurb: "I’m a primary school teacher with two young children, and I want Wallyford to be the best place for all children to grow up. I’m focused on making Wallyford the best it can be for the next generation. I got involved because I care about our village and wanted to help get things done, not just notice what needs fixing. As Treasurer I keep our accounts in order. Whether you’ve got an idea, a question or just want to find out more, come along to a meeting and say hello."

